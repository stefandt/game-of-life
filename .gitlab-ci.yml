default:
  tags:
    - rc-ai-learning

stages:
  - deploy

# Publishes the prebuilt WebAssembly bundle (dist/wasm) plus the Markdown docs
# into the `public/` artifact GitLab Pages serves. The C++ -> WASM build is done
# locally (see BUILD.md); CI only copies the ready files.
pages:
  image: alpine:latest
  stage: deploy
  script:
    - mkdir -p public
    - cp -R dist/wasm/. public/
    - cp README.md SPEC.md ARCHITECTURE.md RETROSPECTIVE.md BUILD.md public/
    - cp -R assets public/
  artifacts:
    paths:
      - public
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
